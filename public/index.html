
<!DOCTYPE html>
<html>
<head>
  <title>My Notes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>My Notes</h1>

  <form id="noteForm">
    <input id="title" placeholder="Note title" required>

    <textarea id="content" placeholder="Write your note" required></textarea>

    <select id="tags" multiple required>
      <option value="study">Study</option>
      <option value="research">Research</option>
    </select>

    <button type="submit" id="saveButton">Create Note</button>
  </form>

  <p id="message"></p>

  <h2>My Saved Notes</h2>

  <div id="notes"></div>

  <script src="script.js"></script>
</body>
</html>
